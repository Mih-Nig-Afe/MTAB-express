# Dev stack — hot reload, no Nginx
services:
  api:
    build:
      context: ./mela-express-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./mela-express-backend:/app
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: ./mela-express-backend
    command: python -m app.bot.bot
    volumes:
      - ./mela-express-backend:/app
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on:
      - api

  worker:
    build:
      context: ./mela-express-backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      MELA_CELERY_WORKER: "1"
    volumes:
      - ./mela-express-backend:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./mela-express-backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./mela-express-backend:/app
    env_file: .env
    depends_on:
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mela_express
      POSTGRES_USER: mela
      POSTGRES_PASSWORD: mela
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mela -d mela_express"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: ./mela-express-dashboard
      dockerfile: Dockerfile.dev
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./mela-express-dashboard:/app
      - /app/node_modules
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    depends_on:
      - api

  public:
    build:
      context: ./mela-express-public
      dockerfile: Dockerfile.dev
    command: npm run dev -- --hostname 0.0.0.0 -p 3000
    volumes:
      - ./mela-express-public:/app
      - /app/node_modules
    ports:
      - "3011:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    depends_on:
      - api

volumes:
  postgres_data:
